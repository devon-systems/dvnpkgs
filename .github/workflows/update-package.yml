name: update-package

"on":
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      command:
        description: >-
          Update pins and write package, changes, upstream, and optional notes
          to $RUNNER_TEMP/update-pr.json. Each change has name, before, and after.
          The first change supplies the PR title.
        required: true
        type: string
      paths:
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: update-${{ inputs.package }}

env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}
    accept-flake-config = true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: alyraffauf
      - name: Update package
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_COMMAND: ${{ inputs.command }}
        run: |
          bash -euo pipefail -c "$UPDATE_COMMAND"
          jq -ef scripts/update-pr.jq "$RUNNER_TEMP/update-pr.json" > "$RUNNER_TEMP/rendered-pr.json"
          jq -er '.body' "$RUNNER_TEMP/rendered-pr.json" > "$RUNNER_TEMP/update-pr.md"
          echo "title=$(jq -er '.title' "$RUNNER_TEMP/rendered-pr.json")" >> "$GITHUB_OUTPUT"
      - name: Open the update PR
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: ${{ github.event.repository.default_branch }}
          branch: updates/${{ inputs.package }}
          add-paths: ${{ inputs.paths }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body-path: ${{ runner.temp }}/update-pr.md
      - name: Enable auto-merge after required CI
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          PR_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: |
          # Required checks prevent --auto from merging before CI has run.
          gh api "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH/protection/required_status_checks" > "$RUNNER_TEMP/required-checks.json"
          jq -e '
            [.contexts[]?, .checks[]?.context] as $required |
            $required | index("CI") != null
          ' "$RUNNER_TEMP/required-checks.json" || {
            echo "Require the CI gate before enabling auto-merge." >&2
            exit 1
          }
          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$PR_HEAD"
