name: update-zen

"on":
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update-zen:
    uses: ./.github/workflows/update-package.yml
    secrets: inherit
    with:
      package: zen-browser
      command: bash scripts/update-zen.sh
      paths: nix/packages/zen-browser/sources.json
