name: update-display-pilot-2

"on":
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update-display-pilot-2:
    uses: ./.github/workflows/update-package.yml
    secrets: inherit
    with:
      package: display-pilot-2
      command: nix develop -c python scripts/update-display-pilot-2.py --report "$RUNNER_TEMP/update-pr.json"
      paths: nix/packages/display-pilot-2/sources.json
